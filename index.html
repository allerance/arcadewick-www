<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcadewick</title>
  <meta name="description" content="Arcadewick. Games.">
  <meta name="theme-color" content="#0C0A09">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Arcadewick">
  <meta property="og:url" content="https://arcadewick.com">
  <meta property="og:description" content="Arcadewick. Games.">
  <meta property="og:image" content="https://arcadewick.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Arcadewick">
  <meta name="twitter:image" content="https://arcadewick.com/og.png">
  <style>
    :root {
      --ember: #E85D04;
      --ember-hover: color-mix(in srgb, #E85D04 78%, #FAF7F2);
      --light: #FAF7F2;
      --dark: #0C0A09;
      --muted: #A29991;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--light);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.45rem 1.75rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (min-width: 720px) {
      body {
        padding: 4.5rem 5.5rem 1.75rem;
      }
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 79rem;
      flex: 1 0 auto;
    }

    .lockup {
      display: block;
      width: min(33rem, 76vw);
      height: auto;
    }

    .tagline {
      margin-top: 0.5rem;
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.2;
      color: var(--light);
    }

    @media (min-width: 720px) {
      .tagline {
        margin-top: 0.7rem;
      }
    }

    a.play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.05rem;
      width: 10.625rem;
      height: 3.3125rem;
      padding: 0;
      color: var(--light);
      background: var(--ember);
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
    }

    a.play:hover {
      background: var(--ember-hover);
    }

    a.play:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 4px;
    }

    .previews {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.95rem;
      width: 100%;
      margin-top: 1.45rem;
    }

    @media (min-width: 720px) {
      .previews {
        grid-template-columns: 1fr 1fr;
        gap: 1.75rem;
        margin-top: 2.1rem;
      }
    }

    figure {
      margin: 0;
    }

    .previews img {
      display: block;
      width: 100%;
      height: auto;
      background: #FAF7F2;
      border-radius: 0.85rem;
    }

    @media (max-width: 719px) {
      .previews img {
        aspect-ratio: 344 / 261;
        object-fit: cover;
        object-position: center;
      }
    }

    figcaption {
      margin-top: 0.55rem;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.3;
      color: var(--light);
    }

    footer {
      margin-top: auto;
      padding-top: 1.15rem;
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--muted);
    }

    @media (min-width: 720px) {
      footer {
        padding-top: 4.5rem;
      }
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--light);
    }

    footer a:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 4px;
      border-radius: 2px;
    }

    footer .dot {
      margin: 0 0.45em;
    }
  </style>
</head>
<body>
  <main>
    <img class="lockup" src="lockup.svg" width="642" height="88" alt="Arcadewick">
    <p class="tagline">Games.</p>
    <a class="play" href="https://play.arcadewick.com/">PLAY</a>
    <div class="previews">
      <figure>
        <img src="preview-killer-sudoku.png" width="618" height="482" alt="Killer Sudoku">
        <figcaption>Killer Sudoku</figcaption>
      </figure>
      <figure>
        <img src="preview-lanternwick.png" width="618" height="482" alt="Lanternwick">
        <figcaption>Lanternwick</figcaption>
      </figure>
    </div>
  </main>
  <footer>
    <a href="/privacy">Privacy</a><span class="dot" aria-hidden="true">·</span><a href="/support">Support</a>
  </footer>
</body>
</html>
