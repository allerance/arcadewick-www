<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcadewick</title>
  <meta name="description" content="Arcadewick. Games.">
  <meta name="theme-color" content="#0C0A09">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Arcadewick">
  <meta property="og:url" content="https://arcadewick.com">
  <meta property="og:description" content="Arcadewick. Games.">
  <meta property="og:image" content="https://arcadewick.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Arcadewick">
  <meta name="twitter:image" content="https://arcadewick.com/og.png">
  <style>
    :root {
      --ember: #E85D04;
      --ember-hover: color-mix(in srgb, #E85D04 72%, #FAF7F2);
      --light: #FAF7F2;
      --dark: #0C0A09;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--light);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 8vh, 5rem) clamp(1.25rem, 5vw, 3rem);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 52rem;
    }

    .lockup {
      display: block;
      width: min(92vw, 520px);
      height: auto;
    }

    p {
      margin-top: 1.75rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--light);
    }

    .previews {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      margin-top: 2rem;
    }

    @media (min-width: 640px) {
      .previews {
        grid-template-columns: 1fr 1fr;
      }
    }

    figure {
      margin: 0;
    }

    .previews img {
      display: block;
      width: 100%;
      height: auto;
      background: #FAF7F2;
      border: 1px solid color-mix(in srgb, var(--light) 18%, transparent);
    }

    figcaption {
      margin-top: 0.6rem;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--light);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.75rem;
      min-height: 44px;
      padding: 0.75rem 0.5rem;
      color: var(--ember);
      font-size: 1rem;
      line-height: 1.4;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
    }

    a.play {
      margin-top: 1.75rem;
      padding: 0.75rem 1.75rem;
      color: var(--light);
      background: var(--ember);
      text-decoration: none;
      letter-spacing: 0.08em;
    }

    a:hover {
      color: var(--ember-hover);
    }

    a.play:hover {
      color: var(--light);
      background: var(--ember-hover);
    }

    a:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 4px;
      border-radius: 2px;
    }

    footer {
      display: flex;
      gap: 1.5rem;
      margin-top: 2.25rem;
    }

    footer a {
      margin-top: 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <img class="lockup" src="lockup.svg" width="670" height="118" alt="Arcadewick">
    <p>This is Arcadewick.</p>
    <div class="previews">
      <figure>
        <img src="preview-killer-sudoku.png" width="1280" height="800" alt="Killer Sudoku">
        <figcaption>Killer Sudoku</figcaption>
      </figure>
      <figure>
        <img src="preview-lanternwick.png" width="1280" height="800" alt="Lanternwick">
        <figcaption>Lanternwick</figcaption>
      </figure>
    </div>
    <a class="play" href="https://play.arcadewick.com/">PLAY</a>
    <footer>
      <a href="privacy.html">Privacy</a>
      <a href="support.html">Support</a>
    </footer>
  </main>
</body>
</html>
