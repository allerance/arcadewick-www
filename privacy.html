<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy — Arcadewick</title>
  <meta name="description" content="Arcadewick privacy.">
  <meta name="theme-color" content="#0C0A09">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <style>
    :root {
      --ember: #E85D04;
      --ember-hover: color-mix(in srgb, #E85D04 72%, #FAF7F2);
      --light: #FAF7F2;
      --dark: #0C0A09;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--light);
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 8vh, 5rem) clamp(1.25rem, 5vw, 3rem);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 36rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1.4;
    }
    p {
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.4;
    }
    a {
      color: var(--ember);
      text-decoration: underline;
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
    }
    a:hover { color: var(--ember-hover); }
    a:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 4px;
      border-radius: 2px;
    }
    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.75rem;
      min-height: 44px;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <main>
    <h1>Privacy</h1>
    <p>Arcadewick.</p>
    <p>Arcadewick does not collect first-party personal data. The only logs that may exist are hosting and CDN logs we do not control.</p>
    <p>First-party retention is not applicable.</p>
    <p>v1 has no accounts, no ads, and no in-app purchase tracking.</p>
    <p>Contact: <a href="mailto:jj_willis@hotmail.com">jj_willis@hotmail.com</a></p>
    <a class="home" href="/">Arcadewick</a>
  </main>
</body>
</html>
